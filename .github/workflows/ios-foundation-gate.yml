name: iOS Foundation Gate
# App Store 2026: Xcode 26+ / iOS 26 SDK validation gate.

on:
  push:
    branches: ['ios/**']
    paths:
      - 'QiblaAstroIOS/**'
      - 'QiblaAstroIOS.xcodeproj/**'
      - 'WebApp/**'
      - 'IOS_PORT_CONTRACT.md'
      - '.ios-baseline-source-sha'
      - '.github/workflows/ios-foundation-gate.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-guard:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select current App Store toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify iOS baseline provenance
        run: |
          test "$(tr -d '\r\n' < .ios-baseline-source-sha)" = "cc2d1c2389a3de4d2cb4dbb6329da868dd1e6247"
          test -f WebApp/index.html
          test -f IOS_PORT_CONTRACT.md
          test "$(git hash-object WebApp/js/18-sky-bg.js)" = "f9ca600d46aaa2bbe0d276b3fb77028d5649d7b4"
          if find . -type f \( -iname '*.p12' -o -iname '*.pfx' -o -iname '*.mobileprovision' -o -iname '*.jks' -o -iname '*.keystore' \) -print -quit | grep -q .; then
            echo 'Signing material must never be committed.' >&2
            exit 1
          fi

      - name: Run protected scientific regressions
        working-directory: WebApp
        run: |
          node scripts/check-protected-core.js
          node tests/wmm2025-official-gate.js
          node tests/wmm2025-global-coverage.test.js
          node tests/wmm2025-runtime-integration.test.js
          node tests/prayer-global-methods.test.js
          node tests/prayer-global-runtime-integration.test.js
          node tests/astronomical-solver.integration.test.js
          node tests/astronomical-verification-session.test.js
          node tests/astronomical-qibla-semantic-mapping.test.js
          node tests/qibla-card-runtime.test.js

      - name: Prove iOS Core Location reaches trusted GNSS safely
        working-directory: WebApp
        run: node tests/ios-core-location-trusted-gnss.test.js

      - name: Prove iOS heading boundary stays magnetic-only
        working-directory: WebApp
        run: node tests/ios-native-heading-boundary.test.js

      - name: Validate Apple metadata and native sensor boundary
        run: |
          plutil -lint QiblaAstroIOS/Info.plist
          plutil -lint QiblaAstroIOS/PrivacyInfo.xcprivacy
          grep -q 'NSLocationWhenInUseUsageDescription' QiblaAstroIOS/Info.plist
          grep -q 'NSCameraUsageDescription' QiblaAstroIOS/Info.plist
          grep -q 'NSMotionUsageDescription' QiblaAstroIOS/Info.plist
          ! grep -q 'NSLocationAlwaysAndWhenInUseUsageDescription' QiblaAstroIOS/Info.plist
          grep -q 'accuracyAuthorization == .fullAccuracy' QiblaAstroIOS/LocationService.swift
          grep -q 'maximumAcceptedAge' QiblaAstroIOS/LocationService.swift
          grep -q 'reduced-accuracy' QiblaAstroIOS/NativeBridge.swift
          grep -q 'newHeading.magneticHeading' QiblaAstroIOS/HeadingService.swift
          ! grep -q 'newHeading.trueHeading' QiblaAstroIOS/HeadingService.swift
          grep -q 'HeadingService.swift in Sources' QiblaAstroIOS.xcodeproj/project.pbxproj

      - name: Build iPhone simulator app without signing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project QiblaAstroIOS.xcodeproj \
            -target QiblaAstroIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/xcodebuild.log

      - name: Inspect built application contract
        run: |
          APP='build/DerivedData/Build/Products/Debug-iphonesimulator/QiblaAstro.app'
          test -d "$APP"
          test -f "$APP/WebApp/index.html"
          test -f "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.qiblalabs.qiblaastro'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx '3.1.1'

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-foundation-xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
