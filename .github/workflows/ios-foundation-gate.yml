name: iOS Foundation Gate
# App Store 2026: Xcode 26+ / iOS 26 SDK validation gate.

on:
  push:
    branches: ['ios/**']
    paths:
      - 'QiblaAstroIOS/**'
      - 'QiblaAstroIOS.xcodeproj/**'
      - 'WebApp/**'
      - 'IOS_PORT_CONTRACT.md'
      - '.ios-baseline-source-sha'
      - '.github/workflows/ios-foundation-gate.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-guard:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select current App Store toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify iOS baseline provenance
        run: |
          test "$(tr -d '\r\n' < .ios-baseline-source-sha)" = "cc2d1c2389a3de4d2cb4dbb6329da868dd1e6247"
          test -f WebApp/index.html
          test -f IOS_PORT_CONTRACT.md
          test "$(git hash-object WebApp/js/18-sky-bg.js)" = "f9ca600d46aaa2bbe0d276b3fb77028d5649d7b4"
          # Camera/scientific geometry remains frozen while only the iOS permission boundary is added.
          test "$(git hash-object WebApp/js/astronomical-observation-bridge.js)" = "1db4f3e4e3b79ae552ee7eaef77272bbfe20c2e5"
          test "$(git hash-object WebApp/js/astronomical-solver.js)" = "b17a4ac09c1a84e640e5007c2d69aaf8b542a65b"
          test "$(git hash-object WebApp/js/astronomical-verification-session.js)" = "3f144a46c0488a8de2f1cb007d400b35fe44ba40"
          test "$(git hash-object WebApp/js/camera-pose.js)" = "519e4773582ddc4bd6d0b4c3c2ffd79073bb1890"
          test "$(git hash-object WebApp/js/camera-projection.js)" = "0ccdd9de84bb11ab41afe01b8b7eca91c1c62384"
          test "$(git hash-object WebApp/js/gravity-reference.js)" = "b4aa8dffd7ba3f0e11a0dba54ad67032bff0b2b7"
          if find . -type f \( -iname '*.p12' -o -iname '*.pfx' -o -iname '*.mobileprovision' -o -iname '*.jks' -o -iname '*.keystore' \) -print -quit | grep -q .; then
            echo 'Signing material must never be committed.' >&2
            exit 1
          fi

      - name: Run protected scientific regressions
        working-directory: WebApp
        run: |
          node scripts/check-protected-core.js
          node tests/wmm2025-official-gate.js
          node tests/wmm2025-global-coverage.test.js
          node tests/wmm2025-runtime-integration.test.js
          node tests/prayer-global-methods.test.js
          node tests/prayer-global-runtime-integration.test.js
          node tests/astronomical-solver.integration.test.js
          QIBLA_IOS_BUNDLED=1 node tests/astronomical-verification-session.test.js
          QIBLA_IOS_BUNDLED=1 node tests/astronomical-qibla-semantic-mapping.test.js
          node tests/qibla-card-runtime.test.js

      - name: Prove iOS Core Location reaches trusted GNSS safely
        working-directory: WebApp
        run: node tests/ios-core-location-trusted-gnss.test.js

      - name: Prove iOS heading boundary stays magnetic-only
        working-directory: WebApp
        run: node tests/ios-native-heading-boundary.test.js

      - name: Prove iOS motion boundary stays magnetic-north referenced
        working-directory: WebApp
        run: node tests/ios-native-motion-boundary.test.js

      - name: Prove iOS orientation adapter uses existing WMM compass path once
        working-directory: WebApp
        run: node tests/ios-orientation-adapter.test.js

      - name: Prove bundled WebKit camera permission boundary is least-privilege
        working-directory: WebApp
        run: node tests/ios-camera-webkit-boundary.test.js

      - name: Validate Apple metadata and native sensor boundary
        run: |
          plutil -lint QiblaAstroIOS/Info.plist
          plutil -lint QiblaAstroIOS/PrivacyInfo.xcprivacy
          grep -q 'NSLocationWhenInUseUsageDescription' QiblaAstroIOS/Info.plist
          grep -q 'NSCameraUsageDescription' QiblaAstroIOS/Info.plist
          grep -q 'NSMotionUsageDescription' QiblaAstroIOS/Info.plist
          ! grep -q 'NSMicrophoneUsageDescription' QiblaAstroIOS/Info.plist
          ! grep -q 'NSLocationAlwaysAndWhenInUseUsageDescription' QiblaAstroIOS/Info.plist
          grep -q 'accuracyAuthorization == .fullAccuracy' QiblaAstroIOS/LocationService.swift
          grep -q 'maximumAcceptedAge' QiblaAstroIOS/LocationService.swift
          grep -q 'reduced-accuracy' QiblaAstroIOS/NativeBridge.swift
          grep -q 'newHeading.magneticHeading' QiblaAstroIOS/HeadingService.swift
          ! grep -q 'newHeading.trueHeading' QiblaAstroIOS/HeadingService.swift
          grep -q 'startDeviceMotionUpdates(using: .xMagneticNorthZVertical' QiblaAstroIOS/MotionService.swift
          ! grep -q 'xTrueNorthZVertical' QiblaAstroIOS/MotionService.swift
          grep -q 'HeadingService.swift in Sources' QiblaAstroIOS.xcodeproj/project.pbxproj
          grep -q 'MotionService.swift in Sources' QiblaAstroIOS.xcodeproj/project.pbxproj
          grep -q "script.src='js/ios-orientation-adapter.js'" QiblaAstroIOS/RootViewController.swift
          grep -q 'requestMediaCapturePermissionFor origin' QiblaAstroIOS/RootViewController.swift
          grep -q 'case .microphone, .cameraAndMicrophone:' QiblaAstroIOS/RootViewController.swift
          test -f WebApp/js/ios-orientation-adapter.js

      - name: Build iPhone simulator app without signing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project QiblaAstroIOS.xcodeproj \
            -scheme QiblaAstroIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/xcodebuild.log

      - name: Inspect built application contract
        run: |
          APP='build/DerivedData/Build/Products/Debug-iphonesimulator/QiblaAstro.app'
          test -d "$APP"
          test -f "$APP/WebApp/index.html"
          test -f "$APP/WebApp/js/ios-orientation-adapter.js"
          test -f "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.qiblalabs.qiblaastro'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx '3.1.1'
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist" | grep -q .
          if /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP/Info.plist" >/dev/null 2>&1; then
            echo 'Microphone usage description must not be present.' >&2
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-foundation-xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
